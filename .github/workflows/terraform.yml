name: Terraform CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write      # Required for AWS OIDC authentication
  contents: read       # Required to checkout the repository
  pull-requests: write # Required to comment PR with plan results

jobs:
  validate-and-lint:
    name: Terraform Validate & Policy-as-Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init (Validation Mode)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      # Part 4 - Policy-as-Code Guardrail check (Checkov)
      # Validates mandatory tags (environment, owner, cost_center) and AWS security best practices
      - name: Run Checkov Policy-as-Code Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          directory: terraform
          soft_fail: true
          output_format: cli

  plan-and-apply:
    name: Terraform Plan & Apply
    needs: validate-and-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # Keyless authentication via AWS OIDC (Part 1 & Part 4)
      - name: Configure AWS Credentials (OIDC)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        if: env.AWS_ROLE_ARN != ''
        run: terraform init

      - name: Terraform Plan
        if: github.event_name == 'pull_request' && env.AWS_ROLE_ARN != ''
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.AWS_ROLE_ARN != ''
        run: terraform apply -auto-approve
